<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moduł 1 - Test Końcowy: Dom i Jedzenie</title>
    <style>
        :root {
            --primary: #1e293b;
            --accent: #10b981; /* Soczysta zieleń */
            --accent-hover: #059669;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-radius: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            --success: #10b981;
            --error: #ef4444;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; 
        }

        body { 
            background: var(--bg); 
            color: var(--text-main); 
            padding: 24px 16px; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
        }

        .container { 
            width: 100%; 
            max-width: 650px; 
            text-align: center; 
        }

        .top-nav { 
            display: flex; 
            justify-content: flex-start; 
            margin-bottom: 20px; 
        }

        .back-btn { 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            color: var(--text-muted); 
            text-decoration: none; 
            font-weight: 600; 
            padding: 8px 18px; 
            background: var(--card-bg); 
            border-radius: 20px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
            transition: all 0.2s;
        }

        .back-btn:hover {
            color: var(--text-main);
            transform: translateY(-1px);
        }

        .card { 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: var(--border-radius); 
            box-shadow: var(--shadow); 
            margin-top: 15px; 
            position: relative; 
            border: 2px solid transparent;
        }

        .question-title { 
            font-size: 1.25rem; 
            font-weight: 700; 
            color: var(--primary); 
            margin-bottom: 20px; 
            line-height: 1.4;
        }

        .options { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .opt-btn { 
            padding: 14px 18px; 
            background: #ffffff; 
            border: 2px solid #e2e8f0; 
            border-radius: 12px; 
            font-size: 1rem; 
            cursor: pointer; 
            text-align: left; 
            font-weight: 600; 
            color: var(--text-main);
            transition: all 0.2s; 
        }

        .opt-btn:hover:not(:disabled) { 
            border-color: var(--accent); 
            background: #f0fdf4; 
        }

        .opt-btn.correct { 
            background: #d1fae5 !important; 
            border-color: var(--success) !important; 
            color: #065f46 !important; 
        }

        .opt-btn.incorrect { 
            background: #fee2e2 !important; 
            border-color: var(--error) !important; 
            color: #991b1b !important; 
        }

        .nav-controls { 
            display: flex; 
            justify-content: space-between; 
            margin-top: 25px; 
            gap: 10px; 
        }

        .nav-btn { 
            padding: 10px 20px; 
            border-radius: 20px; 
            border: 1px solid #cbd5e1; 
            background: #ffffff; 
            color: var(--text-main); 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.2s; 
        }

        .nav-btn:hover:not(:disabled) { 
            background: #f1f5f9; 
        }

        .nav-btn:disabled { 
            opacity: 0.4; 
            cursor: not-allowed; 
        }

        /* Dedykowany przycisk akcji (btn) */
        .btn { 
            padding: 14px 28px; 
            border-radius: 30px; 
            border: none; 
            background: var(--accent); 
            color: white; 
            font-weight: 700; 
            font-size: 1rem; 
            cursor: pointer; 
            transition: all 0.2s; 
            text-decoration: none; 
            display: inline-block; 
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        .btn:hover { 
            background: var(--accent-hover); 
            transform: scale(1.02); 
        }

        .summary-card { 
            display: none; 
        }

        .stars { 
            font-size: 2.5rem; 
            margin: 15px 0; 
            letter-spacing: 5px; 
        }

        .score-display { 
            font-size: 2rem; 
            font-weight: 800; 
            color: var(--accent); 
            margin-bottom: 20px; 
        }

        .summary-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn-secondary {
            background: #94a3b8;
            box-shadow: 0 4px 12px rgba(148, 163, 184, 0.2);
        }

        .btn-secondary:hover {
            background: #64748b;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <a href="module-1-vocab.html" class="back-btn">← Powrót do Modułu 1</a>
    </div>

    <h1>Test Końcowy: Moduł 1</h1>
    <p style="color: var(--text-muted); margin-top: 5px;">Dom i Jedzenie – Sprawdzian wiedzy</p>

    <!-- KARTA QUIZU -->
    <div class="card" id="quiz-area">
        <div style="color: var(--text-muted); margin-bottom: 12px; font-weight: 600;" id="q-num">Pytanie 1 / 20</div>
        <div class="question-title" id="q-title">...</div>
        
        <div class="options" id="options-container"></div>

        <div class="nav-controls">
            <button class="nav-btn" id="prev-btn" onclick="prevQuestion()">← Poprzednie</button>
            <button class="nav-btn" id="next-btn" onclick="manualNextQuestion()">Następne →</button>
        </div>
    </div>

    <!-- KARTA PODSUMOWANIA -->
    <div class="card summary-card" id="summary">
        <h2>Podsumowanie Testu</h2>
        <div class="stars" id="stars-rating">⭐⭐⭐</div>
        <p style="margin: 10px 0; font-size: 1.1rem; color: var(--text-muted);">Twój ostateczny wynik:</p>
        <div class="score-display" id="score-text">0 / 20 (0%)</div>
        
        <div class="summary-actions">
            <button class="btn" onclick="initQuiz()">Powtórz Test 🔄</button>
            <a href="module-1-vocab.html" class="btn btn-secondary">Powrót do modułu</a>
        </div>
    </div>
</div>

<script>
    const questions = [
        // 1. Tłumaczenie
        {
            title: "Jak przetłumaczysz na język polski słowo „refrigerator” / „fridge”?",
            options: [
                { text: "pralka", correct: false },
                { text: "lodówka", correct: true },
                { text: "kuchnia", correct: false }
            ]
        },
        // 2. Dopasowanie
        {
            title: "Wybierz poprawne tłumaczenie dla słowa: „garaż”",
            options: [
                { text: "garden", correct: false },
                { text: "garage", correct: true },
                { text: "kitchen", correct: false }
            ]
        },
        // 3. Uzupełnienie luki w zdaniu
        {
            title: "Uzupełnij zdanie: „W upalne dni piję tylko...”",
            options: [
                { text: "wodę niegazowaną", correct: true },
                { text: "herbata", correct: false },
                { text: "mleko niegazowana", correct: false }
            ]
        },
        // 4. Ułożenie / Wybór poprawnego zdania
        {
            title: "Wybierz poprawnie ułożone zdanie:",
            options: [
                { text: "W salonie stoi wygodna kanapa.", correct: true },
                { text: "Stoi wygodna kanapa w salonie jest.", correct: false },
                { text: "Kanapa w salonie wygodna jest nie.", correct: false }
            ]
        },
        // 5. Dialog
        {
            title: "Uzupełnij dialog:<br>– Co zjesz na deser?<br>– Poproszę kawałek...",
            options: [
                { text: "ciasta jabłkowego", correct: true },
                { text: "borówki", correct: false },
                { text: "chleb", correct: false }
            ]
        },
        // 6. Tłumaczenie
        {
            title: "Co oznacza słowo „blueberries”?",
            options: [
                { text: "truskawki", correct: false },
                { text: "borówki", correct: true },
                { text: "owoce", correct: false }
            ]
        },
        // 7. Miejsca w domu
        {
            title: "Gdzie znajduje się prysznic i wanna?",
            options: [
                { text: "w kuchni", correct: false },
                { text: "w łazience", correct: true },
                { text: "w garażu", correct: false }
            ]
        },
        // 8. Tłumaczenie
        {
            title: "Wybierz polskie słowo dla „living room”:",
            options: [
                { text: "salon", correct: true },
                { text: "pokój", correct: false },
                { text: "mieszkanie", correct: false }
            ]
        },
        // 9. Napoje
        {
            title: "Uzupełnij zdanie: „Rano zawsze piję gorącą...”",
            options: [
                { text: "kawę", correct: true },
                { text: "kawa", correct: false },
                { text: "kawą", correct: false }
            ]
        },
        // 10. Meble
        {
            title: "Co to jest „chair”?",
            options: [
                { text: "stół", correct: false },
                { text: "krzesło", correct: true },
                { text: "okno", correct: false }
            ]
        },
        // 11. Owoce
        {
            title: "Które słowo oznacza „strawberries”?",
            options: [
                { text: "borówki", correct: false },
                { text: "truskawki", correct: true },
                { text: "owoce", correct: false }
            ]
        },
        // 12. Dialog
        {
            title: "Uzupełnij dialog:<br>– Gdzie są dzieci?<br>– Bawią się w...",
            options: [
                { text: "ogrodzie", correct: true },
                { text: "garaż", correct: false },
                { text: "drzwi", correct: false }
            ]
        },
        // 13. Części domu
        {
            title: "Wybierz angielski odpowiednik słowa: „mieszkanie”",
            options: [
                { text: "house", correct: false },
                { text: "apartment", correct: true },
                { text: "room", correct: false }
            ]
        },
        // 14. Meble i wyposażenie
        {
            title: "Uzupełnij zdanie: „Obiad jemy przy...”",
            options: [
                { text: "stole", correct: true },
                { text: "stół", correct: false },
                { text: "stolikiem", correct: false }
            ]
        },
        // 15. Tłumaczenie
        {
            title: "Słowo „window” to po polsku:",
            options: [
                { text: "drzwi", correct: false },
                { text: "okno", correct: true },
                { text: "dom", correct: false }
            ]
        },
        // 16. Kategoria ogólna
        {
            title: "Truskawki i borówki to...",
            options: [
                { text: "owoce", correct: true },
                { text: "warzywa", correct: false },
                { text: "napoje", correct: false }
            ]
        },
        // 17. Wyposażenie
        {
            title: "Wybierz słowo oznaczające „door”:",
            options: [
                { text: "drzwi", correct: true },
                { text: "okno", correct: false },
                { text: "dom", correct: false }
            ]
        },
        // 18. Dialog
        {
            title: "Uzupełnij dialog:<br>– Gdzie jest mleko?<br>– Jest w...",
            options: [
                { text: "lodówce", correct: true },
                { text: "łazience", correct: false },
                { text: "ogrodzie", correct: false }
            ]
        },
        // 19. Tłumaczenie
        {
            title: "Jak przetłumaczysz „tea”?",
            options: [
                { text: "kawa", correct: false },
                { text: "herbata", correct: true },
                { text: "mleko", correct: false }
            ]
        },
        // 20. Ułożenie zdania
        {
            title: "Wybierz poprawne zdanie opisujące dom:",
            options: [
                { text: "Mój dom ma duży ogród i garaż.", correct: true },
                { text: "Mój dom ogród ma duży i garaż.", correct: false },
                { text: "Dom mój garaż ma i duży ogród.", correct: false }
            ]
        }
    ];

    let currentIndex = 0;
    let attempts = 0;
    let answeredQuestions = {}; // Mapa przechowywania stanu: { index: { answered: bool, correct: bool, selectedOpt: idx } }

    function initQuiz() {
        currentIndex = 0;
        answeredQuestions = {};
        document.getElementById('quiz-area').style.display = 'block';
        document.getElementById('summary').style.display = 'none';
        showQuestion();
    }

    function showQuestion() {
        attempts = 0;
        const q = questions[currentIndex];
        
        document.getElementById('q-num').innerText = `Pytanie ${currentIndex + 1} / ${questions.length}`;
        document.getElementById('q-title').innerHTML = q.title;

        // Nawigacja
        document.getElementById('prev-btn').disabled = currentIndex === 0;
        document.getElementById('next-btn').innerText = (currentIndex === questions.length - 1) ? 'Zakończ →' : 'Następne →';

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        const userState = answeredQuestions[currentIndex];

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt.text;

            // Przywracanie stanu po powrocie do pytania
            if (userState && userState.answered) {
                btn.disabled = true;
                if (opt.correct) {
                    btn.classList.add('correct');
                } else if (userState.selectedOpt === idx) {
                    btn.classList.add('incorrect');
                }
            } else {
                btn.onclick = () => handleSelect(btn, opt.correct, idx);
            }

            container.appendChild(btn);
        });
    }

    function handleSelect(btn, isCorrect, optIdx) {
        if (isCorrect) {
            btn.classList.add('correct');
            disableOptions();
            answeredQuestions[currentIndex] = { answered: true, correct: true, selectedOpt: optIdx };
            setTimeout(autoNextQuestion, 1000);
        } else {
            attempts++;
            btn.classList.add('incorrect');
            btn.disabled = true;

            // Próg 3 nieudanych prób
            if (attempts >= 3) {
                disableOptions();
                highlightCorrect();
                answeredQuestions[currentIndex] = { answered: true, correct: false, selectedOpt: optIdx };
                setTimeout(autoNextQuestion, 1500);
            }
        }
    }

    function disableOptions() {
        document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
    }

    function highlightCorrect() {
        const q = questions[currentIndex];
        document.querySelectorAll('.opt-btn').forEach((b, idx) => {
            if (q.options[idx].correct) b.classList.add('correct');
        });
    }

    function autoNextQuestion() {
        if (currentIndex < questions.length - 1) {
            currentIndex++;
            showQuestion();
        } else {
            finishStage();
        }
    }

    function manualNextQuestion() {
        if (currentIndex < questions.length - 1) {
            currentIndex++;
            showQuestion();
        } else {
            finishStage();
        }
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            showQuestion();
        }
    }

    function finishStage() {
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('summary').style.display = 'block';
        
        // Zliczanie poprawnych punktów
        let correctCount = 0;
        Object.values(answeredQuestions).forEach(val => {
            if (val.correct) correctCount++;
        });

        const pct = Math.round((correctCount / questions.length) * 100);
        document.getElementById('score-text').innerText = `${correctCount} / ${questions.length} (${pct}%)`;

        // Ocena gwiazdkowa
        const starsContainer = document.getElementById('stars-rating');
        if (pct >= 85) {
            starsContainer.innerText = "⭐⭐⭐";
        } else if (pct >= 50) {
            starsContainer.innerText = "⭐⭐";
        } else {
            starsContainer.innerText = "⭐";
        }

        // Zapis postępu w localStorage
        let progress = JSON.parse(localStorage.getItem('polish_module_1_progress')) || {};
        progress.testCompleted = true;
        progress.testScore = pct;
        localStorage.setItem('polish_module_1_progress', JSON.stringify(progress));
    }

    window.onload = initQuiz;
</script>

</body>
</html>
